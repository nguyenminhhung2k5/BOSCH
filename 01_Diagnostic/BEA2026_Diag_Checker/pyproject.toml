[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bea-diag-checker"
version = "1.0.0"
description = "Windows desktop serial diagnostics application for BEA devices"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bea-diag-checker = "bea_diag_checker.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["bea_diag_checker*"]
